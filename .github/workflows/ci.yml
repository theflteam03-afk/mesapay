name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mesapay
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mesapay
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/mesapay
      AUTH_SECRET: ci-only-auth-secret-0123456789abcdef0123456789
      PIN_PEPPER: ci-only-pin-pepper-0123456789abcdef01234567890
      NEXT_PUBLIC_WEB_URL: http://localhost:3000
      NEXT_PUBLIC_DASHBOARD_URL: http://localhost:3001
      NEXT_PUBLIC_ADMIN_URL: http://localhost:3002
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Banco (migrações + seed)
        run: pnpm db:migrate && pnpm db:seed
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Testes unitários e de isolamento (RLS)
        run: pnpm test
      - run: pnpm build
      - name: Playwright
        run: pnpm --filter @mesapay/e2e exec playwright install --with-deps chromium
      - name: Testes E2E
        run: pnpm test:e2e
        env:
          CI: "1"
          E2E_PROD: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
